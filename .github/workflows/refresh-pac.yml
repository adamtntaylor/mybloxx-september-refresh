name: Refresh PAC
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build current PAC
        run: python3 build_pac.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- mybloxx-september-refresh.pac; then
            echo "PAC is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mybloxx-september-refresh.pac
          git commit -m "Refresh PAC blocklist"
          git push
